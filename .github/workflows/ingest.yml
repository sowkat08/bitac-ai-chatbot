name: Run Ingest Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # ⚡ [অতি গুরুত্বপূর্ণ]: এটি গিটহাবের সম্পূর্ণ ফাইল এবং ডিলিট হিস্ট্রি ট্র্যাক করতে সাহায্য করবে

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ingest Script
      env:
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        INDEX_NAME: "bitac-chatbot" # আপনার ইনডেক্সের নাম এখানে সরাসরি দেওয়া হলো সেফটি নিশ্চিত করতে
      run: python ingest.py
